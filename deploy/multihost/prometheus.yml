# Multi-machine scrape config: same jobs and intervals as observability/prometheus/prometheus.yml,
# but cAdvisor runs on every machine (port 8082) instead of once on the local host.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: machine-nodes
    metrics_path: /metrics
    static_configs:
      - targets: [machine-1:3000, machine-2:3000, machine-3:3000, machine-4:3000, machine-5:3000]

  - job_name: cadvisor
    static_configs:
      - targets: [machine-1:8082, machine-2:8082, machine-3:8082, machine-4:8082, machine-5:8082]

  - job_name: remediation-engine
    static_configs:
      - targets: ['remediation-engine:4000']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
