name: self-healing-server

# Central control plane for a cluster of 5 PHYSICAL machines (each runs node.compose.yml).
# Everything here runs on one server; the machines are reached by address:
#   - Traefik balances /api/shared over http://machine-N:3000 (file provider: it cannot auto-discover
#     containers on other hosts) and sends /api/gpu-render + /cluster-status to the Smart LB.
#   - Prometheus scrapes machine-N:3000 (app metrics) and machine-N:8082 (cAdvisor).
#   - The Remediation Engine restarts machine-N through that machine's Docker API (DOCKER_HOSTS, mutual TLS).
# machine-N resolves to MACHINE_N_IP through extra_hosts, so every component keeps using the same names.
#
#   docker compose --env-file server.env -f server.compose.yml up -d --build

x-machine-hosts: &machine-hosts
  extra_hosts:
    - "machine-1:${MACHINE_1_IP:?set MACHINE_1_IP}"
    - "machine-2:${MACHINE_2_IP:?set MACHINE_2_IP}"
    - "machine-3:${MACHINE_3_IP:?set MACHINE_3_IP}"
    - "machine-4:${MACHINE_4_IP:?set MACHINE_4_IP}"
    - "machine-5:${MACHINE_5_IP:?set MACHINE_5_IP}"

services:
  traefik:
    <<: *machine-hosts
    image: ${TRAEFIK_IMAGE:-traefik:v3.6}
    command:
      - --api.insecure=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:8080
      - --entrypoints.traefik.address=:8081
      - --log.level=INFO
    ports:
      - "8080:8080" # public gateway
      - "127.0.0.1:8081:8081" # Traefik dashboard
    volumes:
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [cluster-net]
    restart: unless-stopped

  smart-lb-controller:
    <<: *machine-hosts
    build:
      context: ../../smart-lb-controller
    image: self-healing/smart-lb-controller:latest
    environment:
      PORT: "5000"
      EXCLUSIVE_MACHINE: machine-1
    ports:
      - "127.0.0.1:5000:5000"
    networks: [cluster-net]
    restart: unless-stopped

  remediation-engine:
    <<: *machine-hosts
    build:
      context: ../../remediation-engine
    image: self-healing/remediation-engine:latest
    environment:
      PORT: "4000"
      LB_URL: http://smart-lb-controller:5000
      COOLDOWN_SECONDS: ${REMEDIATION_COOLDOWN_SECONDS:-45}
      REBOOT_ETA_SECONDS: ${REBOOT_ETA_SECONDS:-30}
      DOCKER_HOSTS: ${DOCKER_HOSTS:?set DOCKER_HOSTS (machine id -> tcp://host:2376 + certDir)}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      # <DOCKER_CERTS_DIR>/machine-N/{ca,cert,key}.pem - client certificates for each machine's Docker API
      - ${DOCKER_CERTS_DIR:-./certs}:/certs:ro
    depends_on: [smart-lb-controller]
    networks: [cluster-net]
    restart: unless-stopped

  prometheus:
    <<: *machine-hosts
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    depends_on: [alertmanager]
    networks: [cluster-net]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ../../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [cluster-net]
    restart: unless-stopped

  # Promtail on every machine pushes here, so Loki's port must be reachable from the machines
  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ../../observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks: [cluster-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/cluster_overview.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]
    networks: [cluster-net]
    restart: unless-stopped

networks:
  cluster-net:
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:
