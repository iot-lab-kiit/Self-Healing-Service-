# 5s scrape + 5s rule evaluation: the sustained-anomaly window (for: 60s) is judged on fresh data.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: machine-nodes
    metrics_path: /metrics
    static_configs:
      - targets:
          - machine-1:3000
          - machine-2:3000
          - machine-3:3000
          - machine-4:3000
          - machine-5:3000

  # Out-of-band cgroup metrics: still reported if a Node.js event loop freezes completely
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: remediation-engine
    static_configs:
      - targets: ['remediation-engine:4000']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
