name: self-healing-cluster

# Shared definition for the five identical nodes. Identical Traefik labels on every node make
# Traefik merge them into ONE load-balanced "shared" service with 2s /health checks, so a
# rebooting node drops out of rotation automatically.
x-machine: &machine
  build:
    context: ./machine-node
  image: self-healing/machine-node:latest
  mem_limit: 256m
  memswap_limit: 256m
  restart: unless-stopped
  networks:
    - self-healing-net
  labels:
    - "traefik.enable=true"
    - "traefik.http.routers.shared.rule=PathPrefix(`/api/shared`)"
    - "traefik.http.routers.shared.entrypoints=web"
    - "traefik.http.routers.shared.service=shared"
    - "traefik.http.routers.shared.middlewares=shared-retry"
    - "traefik.http.middlewares.shared-retry.retry.attempts=3"
    - "traefik.http.middlewares.shared-retry.retry.initialinterval=100ms"
    - "traefik.http.services.shared.loadbalancer.server.port=3000"
    - "traefik.http.services.shared.loadbalancer.healthcheck.path=/health"
    - "traefik.http.services.shared.loadbalancer.healthcheck.interval=2s"
    - "traefik.http.services.shared.loadbalancer.healthcheck.timeout=1s"

services:
  # ------------------------------------------------------------------ Edge
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.6}
    container_name: traefik
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=self-healing-net
      - --entrypoints.web.address=:8080
      - --entrypoints.traefik.address=:8081
      - --accesslog=true
      - --log.level=INFO
    ports:
      - "8080:8080" # public gateway
      - "8081:8081" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - self-healing-net
    restart: unless-stopped

  smart-lb-controller:
    build:
      context: ./smart-lb-controller
    image: self-healing/smart-lb-controller:latest
    container_name: smart-lb-controller
    environment:
      PORT: "5000"
      EXCLUSIVE_MACHINE: machine-1
    ports:
      - "5000:5000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.smartlb.rule=PathPrefix(`/api/gpu-render`) || PathPrefix(`/cluster-status`)"
      - "traefik.http.routers.smartlb.entrypoints=web"
      - "traefik.http.routers.smartlb.service=smartlb"
      - "traefik.http.services.smartlb.loadbalancer.server.port=5000"
    networks:
      - self-healing-net
    restart: unless-stopped

  # ------------------------------------------------------------------ Self-healing
  remediation-engine:
    build:
      context: ./remediation-engine
    image: self-healing/remediation-engine:latest
    container_name: remediation-engine
    environment:
      PORT: "4000"
      LB_URL: http://smart-lb-controller:5000
      COOLDOWN_SECONDS: ${REMEDIATION_COOLDOWN_SECONDS:-45}
      REBOOT_ETA_SECONDS: ${REBOOT_ETA_SECONDS:-30}
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - smart-lb-controller
    networks:
      - self-healing-net
    restart: unless-stopped

  # ------------------------------------------------------------------ Cluster nodes
  machine-1:
    <<: *machine
    container_name: machine-1
    environment:
      MACHINE_ID: machine-1
      PORT: "3000"
      CONTAINER_MEM_LIMIT_MB: "256"
      SIMULATE_GPU: ${SIMULATE_GPU:-true}
      EXCLUSIVE_SERVICE: "true"
    ports:
      - "3001:3000"

  machine-2:
    <<: *machine
    container_name: machine-2
    environment:
      MACHINE_ID: machine-2
      PORT: "3000"
      CONTAINER_MEM_LIMIT_MB: "256"
      SIMULATE_GPU: ${SIMULATE_GPU:-true}
      EXCLUSIVE_SERVICE: "false"
    ports:
      - "3002:3000"

  machine-3:
    <<: *machine
    container_name: machine-3
    environment:
      MACHINE_ID: machine-3
      PORT: "3000"
      CONTAINER_MEM_LIMIT_MB: "256"
      SIMULATE_GPU: ${SIMULATE_GPU:-true}
      EXCLUSIVE_SERVICE: "false"
    ports:
      - "3003:3000"

  machine-4:
    <<: *machine
    container_name: machine-4
    environment:
      MACHINE_ID: machine-4
      PORT: "3000"
      CONTAINER_MEM_LIMIT_MB: "256"
      SIMULATE_GPU: ${SIMULATE_GPU:-true}
      EXCLUSIVE_SERVICE: "false"
    ports:
      - "3004:3000"

  machine-5:
    <<: *machine
    container_name: machine-5
    environment:
      MACHINE_ID: machine-5
      PORT: "3000"
      CONTAINER_MEM_LIMIT_MB: "256"
      SIMULATE_GPU: ${SIMULATE_GPU:-true}
      EXCLUSIVE_SERVICE: "false"
    ports:
      - "3005:3000"

  # ------------------------------------------------------------------ Observability plane
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    command:
      - --housekeeping_interval=5s
      - --docker_only=true
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - self-healing-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
    networks:
      - self-healing-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - self-healing-net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - self-healing-net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/promtail
    depends_on:
      - loki
    networks:
      - self-healing-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/cluster_overview.json
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - self-healing-net
    restart: unless-stopped

networks:
  self-healing-net:
    name: self-healing-net
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  promtail-data:
  grafana-data:
